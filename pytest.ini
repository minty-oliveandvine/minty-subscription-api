[pytest]
DJANGO_SETTINGS_MODULE = config.settings_test
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# The unit suite only. `pytest e2e` runs the HTTP smoke tests against a live service
# (e2e/README.md); they must never be swept up by a plain `pytest`.
testpaths = billing
# --no-migrations: this service ships no migrations by design (Alembic in Minty owns every
# table it touches), so there is nothing to run and Django would otherwise look for a
# schema the SQLite test DB has no concept of. Tables are built from the models instead;
# see SHARED_MODELS_MANAGED_FOR_TESTING.
addopts = -v --tb=short --no-migrations
# Every stamp in the schema is TIMESTAMPTZ and the engine's clock is the database's: a naive
# datetime anywhere in this service is a bug, so Django's warning about one is an error.
filterwarnings =
    error:.*received a naive datetime.*:RuntimeWarning
