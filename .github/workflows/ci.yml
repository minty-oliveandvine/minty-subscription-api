# Day-one CI: ruff, then pytest twice - once on SQLite (the service's own logic), once on a
# Postgres built from Minty's docs/schema/01_schema_rebased.sql (do the mirrors match the
# real schema?). Part 3 step 1 replaces this with the org's reusable workflows.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      # The Postgres test mode loads Minty/tests/pg_harness.py and builds the schema from
      # Minty/docs/schema/01_schema_rebased.sql - so Minty is checked out beside this repo.
      - uses: actions/checkout@v4
        with:
          repository: minty-oliveandvine/Minty
          token: ${{ secrets.MINTY_READ_TOKEN }}
          path: Minty
          sparse-checkout: |
            tests/pg_harness.py
            docs/schema/01_schema_rebased.sql
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - run: pip install -r requirements.txt

      - name: ruff
        run: ruff check .

      - name: pytest (SQLite)
        run: pytest -q

      - name: pytest (Postgres from 01_schema_rebased.sql)
        env:
          MINTY_TEST_PG_URI: postgresql://postgres:postgres@localhost:5432/postgres
          MINTY_REPO: ${{ github.workspace }}/Minty
          PG_BIN: /usr/bin
        run: |
          sudo apt-get install -y --no-install-recommends postgresql-client
          pytest -q

      - name: the schema name is a setting, not a literal
        env:
          MINTY_DB_SCHEMA: pettycash_alt
        run: pytest -q billing/tests/test_schema_name.py
